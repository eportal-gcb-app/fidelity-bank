<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Banking Demo</title>

  <style>
    :root {
      --orange: #ff6600;
      --orange-dark: #e65c00;
      --white: #ffffff;
      --background: #f7f7f7;
      --text: #333333;
      --border: #dddddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Professional header */

    .header {
      width: 100%;
      background: var(--orange);
      color: var(--white);
      text-align: center;
      padding: 16px 12px;
      border-bottom: 3px solid var(--orange-dark);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 600;
      letter-spacing: 0.8px;
      line-height: 1.3;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 12px;
      letter-spacing: 0.4px;
    }

    /* Centered responsive container */

    .main-content {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .form-wrap {
      width: 100%;
      max-width: 400px;
      background: var(--white);
      padding: 28px 24px;
      border: 1px solid #eeeeee;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .form-title {
      text-align: center;
      color: var(--orange-dark);
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 12px;
    }

    .demo-note {
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      color: #666666;
      margin: 0 0 24px;
    }

    /* Form fields */

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 13px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--white);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      transition: border-color 0.2s ease,
                  box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #999999;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.12);
    }

    /* Continue button */

    .submit-btn {
      display: block;
      width: 100%;
      padding: 16px 12px;
      margin-top: 24px;
      border: none;
      border-radius: 9px;
      background: var(--orange);
      color: var(--white);
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--orange-dark);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    /* Footer */

    footer {
      width: 100%;
      margin-top: auto;
      padding: 15px 12px;
      background: var(--orange);
      color: var(--white);
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    /* Loading animation */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.50);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--white);
      font-size: 16px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--white);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 15px;
      color: #15803d;
    }

    /* Mobile responsiveness */

    @media (max-width: 480px) {
      .header {
        padding: 14px 12px;
      }

      .main-content {
        padding: 24px 16px;
      }

      .form-wrap {
        padding: 24px 20px;
      }
    }

    @media (max-width: 360px) {
      .header {
        padding: 12px 10px;
      }

      .main-content {
        padding: 18px 12px;
      }

      .form-wrap {
        padding: 22px 16px;
      }

      input {
        padding: 12px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }

      input, button, .overlay {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>DIGITAL BANKING DEMO</h1>
    <p>Believe with us.</p>
  </header>

  <main class="main-content">

    <section class="form-wrap">

      <h2 class="form-title">Information Form</h2>

      <p class="demo-note">
        Unofficial demonstration. Enter fictional test details.
        Information is not transmitted or stored.
      </p>

      <form id="dataForm" autocomplete="off">

        <!-- Phone Number -->

        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>

          <input
            type="tel"
            id="phoneNumber"
            inputmode="numeric"
            pattern="[0-9]+"
            placeholder="Enter phone number"
            title="Enter digits only"
            required
          >
        </div>

        <!-- Account Number -->

        <div class="form-group">
          <label for="accountNumber">Account Number</label>

          <input
            type="text"
            id="accountNumber"
            inputmode="numeric"
            pattern="[0-9]+"
            placeholder="Enter account number"
            title="Enter digits only"
            required
          >
        </div>

        <!-- Nickname -->

        <div class="form-group">
          <label for="nickname">Nickname</label>

          <input
            type="text"
            id="nickname"
            pattern="[A-Za-z0-9]+"
            placeholder="Enter nickname"
            title="Enter letters and numbers only"
            autocapitalize="off"
            spellcheck="false"
            required
          >
        </div>

        <!-- Ref Number -->

        <div class="form-group">
          <label for="refNumber">Ref Number</label>

          <input
            type="text"
            id="refNumber"
            inputmode="numeric"
            pattern="[0-9]+"
            placeholder="Enter reference number"
            title="Enter digits only"
            required
          >
        </div>

        <button
          type="submit"
          class="submit-btn"
          id="submitBtn">
          Continue
        </button>

        <div
          id="message"
          class="message"
          role="status"
          aria-live="polite">
        </div>

      </form>

    </section>

  </main>

  <footer>
    All rights reserved @2026
  </footer>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="spinner"></div>
    <span>Processing, please wait...</span>
  </div>

  <script>
    const form = document.getElementById("dataForm");
    const submitBtn = document.getElementById("submitBtn");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");

    // Validate the form locally.

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (submitBtn.disabled || !form.reportValidity()) {
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");

      message.textContent = "";

      await new Promise(resolve => setTimeout(resolve, 1500));

      form.reset();

      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");

      submitBtn.disabled = false;
      submitBtn.textContent = "Continue";

      message.textContent = "Form validation successful.";
    });
  </script>

</body>
</html>
