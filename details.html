<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Services Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }

    .header {
      width: 90%;
      max-width: 600px;
      background: #ff6600;
      color: #ffffff;
      text-align: center;
      padding: 22px;
      margin: 15px auto;
      border-radius: 12px;
    }

    .header h1 {
      font-size: 22px;
      margin: 0;
    }

    .header p {
      font-size: 14px;
      margin: 8px 0 0;
    }

    .container {
      width: 95%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      margin: 10px auto 25px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    .notice {
      text-align: center;
      font-size: 14px;
      color: #555;
      padding: 10px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 8px;
    }

    footer {
      width: 90%;
      max-width: 600px;
      background: #ff6600;
      color: #ffffff;
      text-align: center;
      padding: 18px;
      border-radius: 12px;
      margin: auto auto 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>DIGITAL SERVICES</h1>
    <p>Information Form Demo</p>
  </header>

  <main class="container">

    <p class="notice">
      Demonstration only. Please use fictional sample details.
      Responses are submitted through Google Forms.
    </p>

    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLScknQhZLxjNUYST6cyQtHw8xh3FKabonf1vVCfNRH9p-adKpA/viewform?embedded=true"
      title="Demo Information Form">
      Loading…
    </iframe>

  </main>

  <footer>Digital Services Demo</footer>

</body>
</html>
